<!-- Register -->
<section class="auth">
    <div class="container auth__container">
        <div class="auth__card">
            <h1 class="auth__title">Регистрация</h1>
            <p class="auth__subtitle">Создайте аккаунт за минуту</p>

            <form class="auth__form" method="post" action="/register">
                <div class="auth__field">
                    <label class="auth__label" for="name">Имя</label>
                    <input id="name" name="name" type="text"
                           class="form__input" placeholder="Как к вам обращаться" required>
                </div>

                <div class="auth__field">
                    <label class="auth__label" for="email">Email</label>
                    <input id="email" name="email" type="email"
                           class="form__input" placeholder="you@example.com" required>
                </div>

                <div class="auth__field">
                    <label class="auth__label" for="phone">Телефон</label>
                    <input id="phone" name="phone" type="tel"
                           class="form__input" placeholder="+7 (999) 123-45-67" required>
                </div>

                <div class="auth__field">
                    <label class="auth__label" for="password">Пароль</label>
                    <input id="password" name="password" type="password"
                           class="form__input" placeholder="Минимум 8 символов"
                           minlength="8" required>
                </div>

                <div class="auth__field">
                    <label class="auth__label" for="password2">Повторите пароль</label>
                    <input id="password2" name="password2" type="password"
                           class="form__input" placeholder="Ещё раз" minlength="8" required>
                </div>

                <button type="submit" class="btn btn--primary btn--full">Создать аккаунт</button>
            </form>

            <p class="auth__switch">
                Уже есть аккаунт?
                <a href="/login" class="auth__link">Войти</a>
            </p>
        </div>

        <div class="auth__aside">
            <h2 class="auth__aside-title">Присоединяйтесь</h2>
            <p class="auth__aside-text">
                Зарегистрируйтесь, чтобы отслеживать заказы, копить бонусы
                и получать персональные предложения.
            </p>
            <ul class="auth__features">
                <li>🎁 Бонусы за заказы</li>
                <li>📦 История доставок</li>
                <li>⚡ Быстрый повтор заказа</li>
                <li>🔔 Уведомления о статусе</li>
            </ul>
        </div>
    </div>
</section>

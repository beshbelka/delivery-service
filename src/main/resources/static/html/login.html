<!-- Login -->
<section class="auth">
    <div class="container auth__container">
        <div class="auth__card">
            <h1 class="auth__title">Вход</h1>
            <p class="auth__subtitle">Рады видеть вас снова</p>

            <form class="auth__form" method="post" action="/login">
                <div class="auth__field">
                    <label class="auth__label" for="email">Email</label>
                    <input id="email" name="email" type="email"
                           class="form__input" placeholder="you@example.com" required>
                </div>

                <div class="auth__field">
                    <label class="auth__label" for="password">Пароль</label>
                    <input id="password" name="password" type="password"
                           class="form__input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn--primary btn--full">Войти</button>
            </form>

            <div class="auth__divider"><span>или</span></div>

            <p class="auth__switch">
                Нет аккаунта?
                <a href="/register" class="auth__link">Зарегистрироваться</a>
            </p>
        </div>

        <div class="auth__aside">
            <h2 class="auth__aside-title">Котобус</h2>
            <p class="auth__aside-text">
                Еда, продукты, посылки, лекарства и грузоперевозки —
                всё в одном сервисе. Курьер приедет быстрее, чем закипит чайник.
            </p>
            <ul class="auth__features">
                <li>⚡ Доставка от 30 минут</li>
                <li>🛡️ Страховка заказа</li>
                <li>📍 Трекинг на карте</li>
                <li>💳 Честные цены</li>
            </ul>
        </div>
    </div>
</section>

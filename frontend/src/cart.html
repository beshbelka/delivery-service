<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — Котобус</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/cart.css">
    <script>
        const flag = localStorage.getItem('isAuthenticated');
        if (flag !== 'true') {
            location.replace('/login');
        } else {
            fetch('/auth/profile', { credentials: 'include' })
                .then(r => {
                    if (r.status === 401) location.replace('/login');
                });
        }
    </script>
</head>
<body>

@@include('partials/header.html')

<main class="bucket">
    <div class="container">

        <!-- Заголовок -->
        <div class="bucket__head">
            <h1 class="bucket__title">Корзина</h1>
            <p class="bucket__subtitle">Товары, которые вы выбрали</p>
        </div>

        <!-- Карточка: содержимое корзины -->
        <section class="bucket-card">
            <div class="bucket-card__header">
                <h2 class="bucket-card__title">Ваш заказ</h2>
                <div class="bucket-card__meta">
                    <span class="bucket-card__count" id="cartCount">0</span>
                </div>
            </div>

            <!-- Пустая корзина -->
            <div class="bucket-empty">
                <p>В корзине пока ничего нет.</p>
                <a href="/#services" class="btn btn--primary">Выбрать услугу</a>
            </div>
        </section>

    </div>
</main>

@@include('partials/footer.html')

<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>

</body>
</html>
